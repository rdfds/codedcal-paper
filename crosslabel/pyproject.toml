[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "crosslabel"
version = "0.1.0"
description = "Exact cross-label pair and triplet statistics for stochastically multiplexed localization microscopy"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Rohan Variankaval"}]
dependencies = ["numpy>=1.23", "scipy>=1.10"]

[project.optional-dependencies]
test = ["pytest>=7"]
hdf5 = ["h5py>=3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
